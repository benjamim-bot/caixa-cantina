<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caixa da Cantina</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cantina">
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1c1f24; --muted:#6b7078; --line:#e5e1d8; --soft:#faf8f4;
  --brand:#1c1f24; --brand-soft:#efede8;
  --ok:#1f7a45; --ok-soft:#e9f7ee; --warn:#9a5b13; --warn-soft:#faf5ec; --bad:#b91c1c; --bad-soft:#fdecec;
  --r:12px; --sombra:0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.2}

/* topo */
.topo{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.marca .logo{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;font-size:19px;flex:none}
.marca h1{font-size:18px}
.marca .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca .sub button{background:none;border:0;padding:0;color:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.topo-acoes{display:flex;gap:8px;flex-wrap:wrap}
.topo .btn.fechar{background:var(--ink);border-color:var(--ink);color:#fff}

main{max-width:1280px;margin:0 auto;padding:20px}

/* botões */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,transform .05s}
.btn:hover{background:var(--soft)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.prim{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn.perigo{background:var(--bad-soft);border-color:#f3c4c4;color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:8px}
.btn.lg{padding:14px 18px;font-size:18px;border-radius:12px}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600}
.x{background:none;border:0;color:var(--muted);font-size:16px;width:30px;height:30px;border-radius:8px;flex:none}
.x:hover{background:var(--bad-soft);color:var(--bad)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sombra);padding:16px}
.titulo-secao{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.titulo-secao h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.vazio{color:var(--muted);font-size:14px;text-align:center;padding:14px 4px}

/* configuração */
.setup{max-width:760px;margin:0 auto}
.setup h2.grande{font-size:26px;margin-bottom:4px}
.setup p.intro{color:var(--muted);margin:0 0 18px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campo{display:flex;flex-direction:column;gap:5px}
.campo span{font-size:13px;font-weight:600;color:var(--muted)}
.campo input,.campo textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
.campo input:focus,.campo textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.campo.full{grid-column:1/-1}
.itens-setup{margin-top:18px}
.item-linha{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;align-items:end;margin-bottom:8px}
.item-linha .campo span{display:none}
.item-linha:first-of-type .campo span{display:block}
.setup-rodape{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.dica{font-size:13px;color:var(--muted);margin-top:6px}

/* caixa */
.caixa{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);gap:20px;align-items:start}
.coluna{display:flex;flex-direction:column;gap:16px;min-width:0}
.itens-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}
.item-card{position:relative}
.item-add{width:100%;min-height:118px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sombra);padding:14px 14px 12px;display:flex;flex-direction:column;gap:4px;transition:border-color .12s,transform .05s}
.item-add:hover{border-color:var(--brand)}
.item-add:active{transform:scale(.98)}
.item-nome{font-weight:700;font-size:17px;padding-right:30px;line-height:1.2}
.item-preco{font-size:22px;font-weight:800;margin-top:auto}
.item-estoque{font-size:13px;color:var(--muted)}
.item-estoque.pouco{color:var(--warn);font-weight:700}
.item-card.esgotado .item-add{opacity:.55;background:var(--soft)}
.item-card.esgotado .item-estoque{color:var(--bad);font-weight:700}
.item-edit{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:15px;color:var(--muted)}
.item-edit:hover{color:var(--ink);border-color:var(--ink)}
.item-badge{position:absolute;top:-8px;left:-8px;background:var(--brand);color:#fff;border-radius:999px;min-width:26px;height:26px;padding:0 7px;display:grid;place-items:center;font-weight:800;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tecla{position:absolute;bottom:10px;right:12px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
@media (hover:none){.tecla{display:none}}
.novo-item{min-height:118px;border:2px dashed var(--line);border-radius:var(--r);background:transparent;color:var(--muted);font-weight:600}
.novo-item:hover{border-color:var(--brand);color:var(--brand)}

.carrinho .linha{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.l-nome{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.qtd{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qtd button{border:0;background:var(--soft);width:32px;height:32px;font-size:18px;font-weight:700}
.qtd span{min-width:30px;text-align:center;font-weight:700}
.l-preco{border:1px dashed var(--line);background:none;border-radius:8px;padding:4px 8px;font-size:14px;color:var(--muted);white-space:nowrap}
.l-preco:hover{border-color:var(--brand);color:var(--brand)}
.l-preco.editado{border-style:solid;border-color:#f0c9a8;background:var(--brand-soft);color:var(--brand);font-weight:700}
.l-sub{font-weight:700;min-width:84px;text-align:right}
.total-linha{display:flex;justify-content:space-between;align-items:center;padding:12px 0 6px;gap:10px}
.total-linha .rot{font-weight:700;font-size:18px}
.total-btn{background:none;border:0;padding:0;font-size:30px;font-weight:800;border-bottom:2px dashed transparent}
.total-btn:hover{border-color:var(--brand)}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:6px;padding:2px 6px;background:var(--brand-soft);color:var(--brand);vertical-align:middle}
.formas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.forma{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}

.forma.on{color:#fff;background:var(--ink);border-color:var(--ink)}


.troco{display:flex;gap:12px;align-items:end;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.troco .campo{flex:1}
.troco .val{font-size:22px;font-weight:800;padding-bottom:6px}
.troco .val small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.finalizar{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.limpar-linha{text-align:center;margin-top:8px}

.resumo .grande{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:12px}
.resumo .grande small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.resumo .grande strong{font-size:32px;font-weight:800;line-height:1.1}
.formas-mini{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fm{display:flex;align-items:center;gap:7px;font-size:14px}
.fm b{margin-left:auto}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.stats div{background:var(--soft);border-radius:10px;padding:8px 4px}
.stats b{display:block;font-size:20px}
.stats small{color:var(--muted);font-size:12px}
.stats .pend b{color:var(--warn)}

.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lista li:last-child{border-bottom:0}
.lista .info{flex:1;min-width:0}
.lista .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista .info small{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista .valor{font-weight:700;white-space:nowrap}
.lista li.cancelada .info,.lista li.cancelada .valor{opacity:.45;text-decoration:line-through}
.rolavel{max-height:360px;overflow:auto;margin-right:-6px;padding-right:6px}

.badge{font-weight:600}
.badge.pendente{color:var(--warn)}

/* histórico */
.hist{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hist-item{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hist-item .info{flex:1;min-width:200px}
.hist-item .info b{font-size:17px}
.hist-item .info small{display:block;color:var(--muted)}
.hist-item .total{font-size:20px;font-weight:800}

/* relatório */
.rel-acoes{display:flex;gap:8px;flex-wrap:wrap;max-width:620px;margin:0 auto 14px}
.relatorio{max-width:620px;margin:0 auto;background:#fff;border-radius:14px;border:1px solid var(--line);padding:32px 34px}
.rel-cab{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.rel-cab small{font-size:13px;color:var(--muted)}
.rel-cab h1{font-size:26px;margin:2px 0}
.rel-cab p{margin:0;color:var(--muted)}
.rel-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.rel-total span{font-weight:600}
.rel-total strong{font-size:32px;font-weight:800}
.rel-linha{display:flex;justify-content:space-between;gap:12px;padding:4px 0;color:var(--muted)}
.rel-linha b{color:var(--ink)}
.relatorio h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 6px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}
td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
td+td,th+th{padding-left:12px}
td.r,th.r{text-align:right}
tr.tot td{font-weight:800;border-bottom:0}
tr.cancelada td{color:#9ca3af;text-decoration:line-through}
.obs{margin:0;white-space:pre-wrap}
.rel-detalhes{margin-top:26px;font-size:14px}
.rel-detalhes summary{cursor:pointer;color:var(--muted);font-weight:600}

/* modal */
dialog{border:0;border-radius:18px;padding:0;width:min(440px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,24,30,.5)}
.modal-box{padding:22px}
.modal-box h3{font-size:20px;margin-bottom:12px}
.modal-corpo{display:flex;flex-direction:column;gap:12px}
.modal-corpo p{margin:0;color:var(--muted)}
.modal-botoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.modal-botoes .btn{flex:1 1 auto}
.modal-botoes .btn[value=""]{flex:0 0 auto;background:none;border-color:transparent;color:var(--muted)}
.modal-botoes .forma-btn{flex:1 1 calc(50% - 8px);color:#fff;border:0;padding:14px}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.mini-tabela{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:15px}
.mini-tabela div{display:flex;justify-content:space-between;padding:2px 0}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.erro{background:var(--bad)}

/* celular: abas + barra fixa */
.abas-cel,.barra-fixa{display:none}
.instalar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--brand-soft);border-radius:var(--r);padding:12px 14px;margin:0 auto 14px;max-width:760px;font-size:15px}
@media (max-width:860px){
  .caixa{grid-template-columns:1fr}
  .abas-cel{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--brand-soft);border-radius:12px;padding:4px;margin-bottom:14px}
  .abas-cel button{border:0;background:none;border-radius:9px;padding:11px 6px;font-weight:700;font-size:16px;color:var(--muted)}
  .abas-cel button.on{background:var(--card);color:var(--ink);box-shadow:var(--sombra)}
  .abas-cel small{display:block;font-weight:600;font-size:13px}
  .caixa.aba-vender>aside,.caixa.aba-resumo>section{display:none}
  .carrinho .finalizar{display:none}
  .barra-fixa.on{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;gap:8px;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .bf-total{margin-right:auto;line-height:1.1}
  .bf-total small{display:block;color:var(--muted);font-size:13px}
  .bf-total b{font-size:22px}
  .barra-fixa .btn{padding:14px 16px;font-size:17px}
  main.com-barra{padding-bottom:100px}
  main.com-barra~#toast{bottom:96px}
}
@media (max-width:560px){
  body{font-size:17px}
  main{padding:14px 12px}
  .topo{padding:10px 12px}
  .topo-acoes{width:100%}
  .topo-acoes .btn{flex:1}
  .campos{grid-template-columns:1fr}
  .itens-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .item-add{min-height:104px;padding:12px}
  .item-nome{font-size:15px}
  .item-preco{font-size:19px}
  .formas{grid-template-columns:repeat(2,1fr)}
  .carrinho .linha{grid-template-columns:minmax(0,1fr) auto auto;}
  .carrinho .l-sub{display:none}
  .relatorio{padding:20px 16px;border-radius:14px}
  .item-linha{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,.8fr) 30px;gap:6px}
  .esconde-cel{display:none}
}

@media print{
  @page{margin:14mm}
  body{background:#fff}
  .topo,.no-print,#toast{display:none!important}
  main{padding:0;max-width:none}
  .relatorio{box-shadow:none;border:0;padding:0;max-width:none}
  .relatorio{border-radius:0}
  tr{break-inside:avoid}
  h2{break-after:avoid}
}
</style>
</head>
<body>
<header class="topo" id="topo"></header>
<main id="app"></main>
<dialog id="modal"></dialog>
<div id="toast"></div>
<input type="file" id="arquivo" accept=".json,application/json" hidden>

<script>
'use strict';
const CHAVE = 'caixa-cantina-v1';
const FORMAS = {
  pix:      {nome:'Pix',      ic:'⚡'},
  debito:   {nome:'Débito',   ic:'💳'},
  credito:  {nome:'Crédito',  ic:'💳'},
  dinheiro: {nome:'Dinheiro', ic:'💵'},
};
const ORDEM = ['pix','debito','credito','dinheiro'];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const agora = () => new Date().toISOString();
const R$ = c => (c / 100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const paraCampo = c => c == null ? '' : (c / 100).toFixed(2).replace('.', ',');
const hora = iso => iso ? new Date(iso).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : '';
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const dataBR = iso => { if (!iso) return ''; const [a, m, d] = iso.split('-'); return `${d}/${m}/${a}`; };
const dataLonga = iso => { if (!iso) return ''; const [a, m, d] = iso.split('-').map(Number); return new Date(a, m - 1, d).toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); };
function lerDinheiro(txt) {
  let s = String(txt ?? '').replace(/R\$|\s/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) : NaN;
}
function lerInteiro(txt) {
  const s = String(txt ?? '').trim();
  if (!s) return null;
  const n = Number(s);
  return Number.isInteger(n) && n >= 0 ? n : NaN;
}
let toastTimer;
function toast(msg, erro = false) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'on' + (erro ? ' erro' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 2600);
}

/* ---------- estado ---------- */
function novoCarrinho() { return {linhas: [], totalManual: null, forma: null, recebido: ''}; }
function carregar() {
  try {
    const s = JSON.parse(localStorage.getItem(CHAVE));
    if (s && typeof s === 'object') return {atual: s.atual || null, historico: Array.isArray(s.historico) ? s.historico : [], carrinho: s.carrinho || novoCarrinho()};
  } catch (e) {}
  return {atual: null, historico: [], carrinho: novoCarrinho()};
}
let S = carregar();
let armazenamentoOk = true;
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(S)); armazenamentoOk = true; }
  catch (e) { if (armazenamentoOk) toast('Este navegador não está salvando os dados. Baixe um backup!', true); armazenamentoOk = false; }
}

let tela = S.atual ? 'caixa' : 'inicio';
let relatorioId = null;
let rascunho = null;
let abaCel = 'vender';
let pedidoInstalar = null;

/* ---------- contas ---------- */
const ativas = c => c.vendas.filter(v => v.status !== 'cancelada');
const unidades = v => v.linhas.reduce((a, l) => a + l.qtd, 0);
const vendidoDe = (c, id) => ativas(c).reduce((s, v) => s + v.linhas.filter(l => l.itemId === id).reduce((a, l) => a + l.qtd, 0), 0);
const noCarrinho = id => S.carrinho.linhas.filter(l => l.itemId === id).reduce((a, l) => a + l.qtd, 0);
const restam = (c, it) => it.estoque == null ? Infinity : it.estoque - vendidoDe(c, it.id);
const descreve = v => v.linhas.map(l => `${l.qtd}× ${l.nome}`).join(', ');

function precoLinha(l) {
  if (l.editado) return l.precoUnit;
  const it = S.atual.itens.find(i => i.id === l.itemId);
  return it ? it.precoBase : l.precoUnit;
}
const subtotalCarrinho = () => S.carrinho.linhas.reduce((a, l) => a + l.qtd * precoLinha(l), 0);
const totalCarrinho = () => S.carrinho.totalManual ?? subtotalCarrinho();

function resumo(c) {
  const r = {porForma: {pix:0, debito:0, credito:0, dinheiro:0}, nPorForma: {pix:0, debito:0, credito:0, dinheiro:0},
             recebido: 0, pendente: 0, unid: 0, unidPagas: 0, unidPend: 0, descontos: 0, nVendas: 0, nCanceladas: 0, porItem: {}};
  c.itens.forEach(i => r.porItem[i.id] = {nome: i.nome, estoque: i.estoque, precoBase: i.precoBase, vendidos: 0, receita: 0});
  for (const v of c.vendas) {
    if (v.status === 'cancelada') { r.nCanceladas++; continue; }
    r.nVendas++;
    const u = unidades(v);
    r.unid += u;
    if (v.status === 'pago') { r.porForma[v.forma] += v.total; r.nPorForma[v.forma]++; r.recebido += v.total; r.unidPagas += u; }
    else { r.pendente += v.total; r.unidPend += u; }
    r.descontos += v.linhas.reduce((a, l) => a + l.qtd * l.precoBase, 0) - v.total;
    // receita por item: divide o total da venda proporcionalmente (caso o total tenha sido ajustado)
    const sub = v.linhas.reduce((a, l) => a + l.qtd * l.precoUnit, 0);
    let resto = v.total;
    v.linhas.forEach((l, i) => {
      const p = r.porItem[l.itemId] || (r.porItem[l.itemId] = {nome: l.nome, estoque: null, vendidos: 0, receita: 0});
      p.vendidos += l.qtd;
      const val = i === v.linhas.length - 1 ? resto : (sub ? Math.round(l.qtd * l.precoUnit * v.total / sub) : 0);
      resto -= val; p.receita += val;
    });
  }
  return r;
}

function acharVenda(id) {
  for (const c of [S.atual, ...S.historico]) {
    if (!c) continue;
    const v = c.vendas.find(x => x.id === id);
    if (v) return {c, v};
  }
  return {};
}

/* ---------- modal ---------- */
function modal({titulo, corpo = '', botoes}) {
  return new Promise(res => {
    const d = $('#modal');
    d.innerHTML = `<form method="dialog" class="modal-box"><h3>${titulo}</h3><div class="modal-corpo">${corpo}</div>
      <div class="modal-botoes">${botoes.map(b => `<button value="${b.valor}" class="btn ${b.classe || ''}" ${b.estilo ? `style="${b.estilo}"` : ''}>${b.texto}</button>`).join('')}</div></form>`;
    const f = d.querySelector('form');
    d.returnValue = '';
    d.onclose = () => {
      const dados = {};
      f.querySelectorAll('[name]').forEach(el => dados[el.name] = el.value);
      res({acao: d.returnValue, dados});
    };
    d.showModal();
    const primeiro = f.querySelector('input,textarea');
    if (primeiro) { primeiro.focus(); primeiro.select?.(); }
  });
}
const campoHTML = (rotulo, nome, valor = '', extra = '') =>
  `<label class="campo"><span>${rotulo}</span><input name="${nome}" value="${esc(valor)}" ${extra}></label>`;
const CANCELAR = {texto: 'Cancelar', valor: ''};

async function confirmar(titulo, texto, sim = 'Confirmar', classe = 'prim') {
  const {acao} = await modal({titulo, corpo: `<p>${texto}</p>`, botoes: [{texto: sim, valor: 'sim', classe}, CANCELAR]});
  return acao === 'sim';
}

// carrinho
function adicionar(id, delta) {
  const c = S.atual, it = c.itens.find(i => i.id === id);
  if (!it) return;
  if (delta > 0 && restam(c, it) - noCarrinho(id) <= 0) return toast(`${it.nome} esgotado. Use o ✎ para ajustar a quantidade.`, true);
  let l = S.carrinho.linhas.find(x => x.itemId === id);
  if (!l) { if (delta < 0) return; l = {itemId: id, qtd: 0, precoUnit: it.precoBase, editado: false}; S.carrinho.linhas.push(l); }
  l.qtd += delta;
  if (l.qtd <= 0) S.carrinho.linhas = S.carrinho.linhas.filter(x => x !== l);
  S.carrinho.totalManual = null;
  salvar(); render();
}

async function finalizar(pago) {
  const car = S.carrinho, c = S.atual;
  if (!car.linhas.length) return toast('Adicione algum item primeiro', true);
  const total = totalCarrinho();
  let nome = null;
  if (pago) {
    if (!car.forma) return toast('Escolha a forma de pagamento', true);
    if (car.forma === 'dinheiro') {
      const rec = lerDinheiro(car.recebido);
      if (rec != null && !Number.isNaN(rec) && rec < total) return toast('O valor recebido é menor que o total', true);
    }
  } else {
    const {acao, dados} = await modal({
      titulo: 'Pagar depois',
      corpo: `<p>${esc(car.linhas.map(l => `${l.qtd}× ${c.itens.find(i => i.id === l.itemId)?.nome}`).join(', '))} — <b>${R$(total)}</b></p>` +
             campoHTML('Nome de quem vai pagar', 'nome', '', 'autocomplete="off" placeholder="Ex.: Irmã Maria"'),
      botoes: [{texto: 'Anotar pendência', valor: 'ok', classe: 'warn'}, CANCELAR]});
    if (acao !== 'ok') return;
    nome = dados.nome.trim();
    if (!nome) return toast('Coloque o nome da pessoa', true);
  }
  const venda = {
    id: uid(), hora: agora(), total,
    linhas: car.linhas.map(l => { const it = c.itens.find(i => i.id === l.itemId); return {itemId: l.itemId, nome: it.nome, qtd: l.qtd, precoUnit: precoLinha(l), precoBase: it.precoBase}; }),
    status: pago ? 'pago' : 'pendente', forma: pago ? car.forma : null, nome, pagoEm: pago ? agora() : null,
  };
  c.vendas.push(venda);
  S.carrinho = novoCarrinho();
  salvar(); render();
  toast(pago ? `Venda de ${R$(total)} registrada (${FORMAS[venda.forma].nome})` : `Pendência de ${nome} anotada`);
}

};

async function formItem(it) {
  const c = S.atual, vendidos = it ? vendidoDe(c, it.id) : 0;
  const {acao, dados} = await modal({
    titulo: it ? `Editar ${esc(it.nome)}` : 'Novo item',
    corpo: (it ? `<p>Novo preço base vale para as próximas vendas. As ${vendidos} unidades já vendidas mantêm o preço da hora.</p>` : '') +
      campoHTML('Nome', 'nome', it?.nome ?? '', 'autocomplete="off" placeholder="Ex.: Refri lata"') +
      campoHTML('Preço base (R$)', 'preco', it ? paraCampo(it.precoBase) : '', 'inputmode="decimal" autocomplete="off"') +
      campoHTML(`Quantidade total do dia${it ? ` (já vendidos: ${vendidos})` : ''}`, 'qtd', it?.estoque ?? '', 'inputmode="numeric" autocomplete="off" placeholder="Vazio = sem limite"'),
    botoes: [{texto: 'Salvar', valor: 'ok', classe: 'prim'}, ...(it && !vendidos ? [{texto: 'Remover item', valor: 'rem', classe: 'perigo'}] : []), CANCELAR]});
  if (acao === 'rem') {
    c.itens = c.itens.filter(i => i !== it);
    S.carrinho.linhas = S.carrinho.linhas.filter(l => l.itemId !== it.id);
    salvar(); render(); return;
  }
  if (acao !== 'ok') return;
  const nome = dados.nome.trim(), preco = lerDinheiro(dados.preco), qtd = lerInteiro(dados.qtd);
  if (!nome) return toast('Falta o nome', true);
  if (preco == null || Number.isNaN(preco)) return toast('Preço inválido', true);
  if (Number.isNaN(qtd)) return toast('Quantidade inválida', true);
  if (qtd != null && qtd < vendidos) return toast(`Já foram vendidos ${vendidos}; a quantidade não pode ser menor`, true);
  if (it) {
    const mudouPreco = preco !== it.precoBase;
    Object.assign(it, {nome, precoBase: preco, estoque: qtd});
    toast(mudouPreco ? `Novo preço de ${nome}: ${R$(preco)} daqui pra frente` : 'Item atualizado');
  } else {
    c.itens.push({id: uid(), nome, precoBase: preco, estoque: qtd});
    toast(`${nome} adicionado`);
  }
  salvar(); render();
}

A.backup = () => {
  const blob = new Blob([JSON.stringify({app: 'caixa-cantina', versao: 1, exportadoEm: agora(), ...S}, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');

A.restaurar = () => $('#arquivo').click();
$('#arquivo').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const dados = JSON.parse(await f.text());
    if (!dados || !Array.isArray(dados.historico)) throw 0;
    let novos = 0;
    for (const c of dados.historico) if (c?.id && !S.historico.some(x => x.id === c.id)) { S.historico.push(c); novos++; }
    S.historico.sort((a, b) => (b.fechadaEm || '').localeCompare(a.fechadaEm || ''));
    let msg = `${novos} cantina(s) importada(s)`;
    if (dados.atual && !S.atual) { S.atual = dados.atual; msg += ' + cantina em andamento'; }
    else if (dados.atual && S.atual && dados.atual.id !== S.atual.id) msg += ' (a cantina aberta do backup foi ignorada porque já há uma aberta aqui)';
    salvar(); render(); toast(msg);
  } catch (err) { toast('Arquivo de backup inválido', true); }
});

      <div class="titulo-secao"><h2>O que vai ser vendido</h2>${ult ? `<button class="link" data-acao="copiar-ultima">Usar itens da última cantina</button>` : ''}</div>
      ${r.itens.map((l, i) => `<div class="item-linha">
        <label class="campo"><span>Item</span><input data-item-idx="${i}" data-item-campo="nome" value="${esc(l.nome)}" placeholder="${i === 0 ? 'Ex.: Combo lanche + refri' : 'Ex.: Doce, Refri avulso...'}" autocomplete="off"></label>
        <label class="campo"><span>Preço base</span><input data-item-idx="${i}" data-item-campo="preco" value="${esc(l.preco)}" inputmode="decimal" placeholder="R$ 0,00" autocomplete="off"></label>
        <label class="campo"><span>Quantidade</span><input data-item-idx="${i}" data-item-campo="qtd" value="${esc(l.qtd)}" inputmode="numeric" placeholder="Sem limite" autocomplete="off"></label>
        <button class="x" data-acao="rem-linha-setup" data-idx="${i}" title="Remover">✕</button></div>`).join('')}
      <button class="btn sm" data-acao="add-linha-setup">+ Adicionar item</button>
      <div class="dica">Quantidade = quantos foram feitos para hoje. Deixe vazio se não tiver limite.</div>
    </div>
    <div class="setup-rodape">
      <span></span>
      <button class="btn ok lg" data-acao="abrir-caixa">Abrir caixa →</button>
    </div>
  </div></div>`;
}

function renderCaixa() {
  const c = S.atual, r = resumo(c), car = S.carrinho;
  const cards = c.itens.map((it, i) => {
    const rest = restam(c, it), qc = noCarrinho(it.id), livre = rest - qc;
    const esgot = livre <= 0;
    const nv = vendidoDe(c, it.id);
    const est = it.estoque == null ? `${nv} vendido${nv === 1 ? '' : 's'}` : (esgot && qc ? `todos no carrinho` : esgot ? 'Esgotado' : `restam ${livre} de ${it.estoque}`);
    return `<div class="item-card ${esgot ? 'esgotado' : ''}">
      <button class="item-add" data-acao="add" data-id="${it.id}">
        <span class="item-nome">${esc(it.nome)}</span>
        <span class="item-preco num">${R$(it.precoBase)}</span>
        <span class="item-estoque ${!esgot && it.estoque != null && livre <= 5 ? 'pouco' : ''}">${est}</span>
        ${i < 9 ? `<span class="tecla">${i + 1}</span>` : ''}
      </button>
      <button class="item-edit" data-acao="editar-item" data-id="${it.id}" title="Editar preço base / quantidade">✎</button>
      ${qc ? `<span class="item-badge">${qc}</span>` : ''}
    </div>`;
  }).join('');

  const total = totalCarrinho();
  const linhas = car.linhas.map(l => {
    const it = c.itens.find(i => i.id === l.itemId); const p = precoLinha(l);
    return `<div class="linha">
      <span class="l-nome">${esc(it?.nome)}</span>
      <div class="qtd"><button data-acao="menos" data-id="${l.itemId}">−</button><span class="num">${l.qtd}</span><button data-acao="mais" data-id="${l.itemId}">+</button></div>
      <button class="l-preco num ${l.editado ? 'editado' : ''}" data-acao="preco-linha" data-id="${l.itemId}" title="Mudar o preço só nesta venda">${R$(p)} un ✎</button>
      <span class="l-sub num">${R$(p * l.qtd)}</span></div>`;
  }).join('');
  const rec = lerDinheiro(car.recebido);
  const carrinho = `<div class="card carrinho">
    <div class="titulo-secao"><h2>Venda atual</h2>${car.linhas.length ? `<button class="link" data-acao="limpar">Limpar</button>` : ''}</div>
    ${car.linhas.length ? linhas : `<div class="vazio">Toque nos itens acima para começar a venda</div>`}
    <div class="total-linha"><span class="rot">Total ${car.totalManual != null ? '<span class="tag">ajustado</span>' : ''}</span>
      <button class="total-btn num" data-acao="editar-total" title="Ajustar o total desta venda">${R$(total)}</button></div>
    <div class="formas">${ORDEM.map(f => `<button class="forma ${car.forma === f ? 'on' : ''}" data-acao="forma" data-forma="${f}">${FORMAS[f].nome}</button>`).join('')}</div>
    ${car.forma === 'dinheiro' ? `<div class="troco">
        <label class="campo"><span>Valor recebido</span><input id="recebido" value="${esc(car.recebido)}" inputmode="decimal" placeholder="R$ 0,00" autocomplete="off"></label>
        <div class="val num" id="troco">${trocoHTML(rec, total)}</div></div>` : ''}
    <div class="finalizar">
      <button class="btn ok lg" data-acao="pago" ${!car.linhas.length || !car.forma ? 'disabled' : ''}>✔ Pago</button>
      <button class="btn warn lg" data-acao="pendente" ${!car.linhas.length ? 'disabled' : ''} title="A pessoa leva agora e paga depois">⏳ Paga depois</button>
    </div>
  </div>`;

  const limitados = c.itens.filter(i => i.estoque != null);
  const restamTotal = limitados.length ? limitados.reduce((a, i) => a + restam(c, i), 0) : null;
  const painel = `<div class="card resumo">
      <div class="grande"><div><small>Arrecadado</small><strong class="num">${R$(r.recebido)}</strong></div>
        <div style="text-align:right"><small>${r.nVendas} venda(s)</small></div></div>
      <div class="formas-mini">${ORDEM.map(f => `<div class="fm">${FORMAS[f].nome}<b class="num">${R$(r.porForma[f])}</b></div>`).join('')}</div>
      <div class="stats">
        <div><b class="num">${r.unid}</b><small>vendidos</small></div>
        <div><b class="num">${restamTotal ?? '—'}</b><small>restam</small></div>
        <div class="pend"><b class="num">${R$(r.pendente)}</b><small>a receber</small></div>
      </div></div>`;

  const pend = c.vendas.filter(v => v.status === 'pendente');
  const pendCard = `<div class="card ${pend.length ? 'pend-card' : ''}">
    <div class="titulo-secao"><h2>Pendências ${pend.length ? `(${pend.length})` : ''}</h2></div>
    ${pend.length ? `<ul class="lista">${pend.map(v => `<li>
      <div class="info"><b>${esc(v.nome)}</b><small>${esc(descreve(v))} · ${hora(v.hora)}</small></div>
      <span class="valor num">${R$(v.total)}</span>
      <button class="btn sm ok" data-acao="receber" data-id="${v.id}">Receber</button>
      <button class="x" data-acao="cancelar-venda" data-id="${v.id}" title="Cancelar pendência">✕</button></li>`).join('')}</ul>`
      : `<div class="vazio">Ninguém devendo por enquanto 🙏</div>`}
  </div>`;

  const ult = [...c.vendas].reverse();
  const vendasCard = `<div class="card">
    <div class="titulo-secao"><h2>Vendas do dia</h2></div>
    ${ult.length ? `<ul class="lista rolavel">${ult.map(v => `<li class="${v.status === 'cancelada' ? 'cancelada' : ''}">
      <div class="info"><b>${esc(descreve(v))}</b><small>${hora(v.hora)} · ${statusHTML(v)}</small></div>
      <span class="valor num">${R$(v.total)}</span>
      ${v.status !== 'cancelada' ? `<button class="x" data-acao="cancelar-venda" data-id="${v.id}" title="Desfazer venda">✕</button>` : '<span style="width:30px"></span>'}</li>`).join('')}</ul>`
      : `<div class="vazio">Nenhuma venda ainda</div>`}
  </div>`;

  return `<div class="abas-cel">
      <button class="${abaCel === 'vender' ? 'on' : ''}" data-acao="aba" data-aba="vender">Vender</button>
      <button class="${abaCel === 'resumo' ? 'on' : ''}" data-acao="aba" data-aba="resumo">Resumo<small class="num">${R$(r.recebido)}${pend.length ? ` · ${pend.length} devendo` : ''}</small></button>
    </div>
    <div class="caixa aba-${abaCel}">
    <section class="coluna">
      <div class="itens-grid">${cards}<button class="novo-item" data-acao="novo-item">+ Novo item</button></div>
      ${carrinho}
    </section>
    <aside class="coluna">${painel}${pendCard}${vendasCard}</aside>
  </div>
  <div class="barra-fixa ${car.linhas.length && abaCel === 'vender' ? 'on' : ''}">
    <div class="bf-total"><small>Total</small><b class="num">${R$(total)}</b></div>
    <button class="btn warn" data-acao="pendente">Paga depois</button>
    <button class="btn ok" data-acao="pago">✔ Pago</button>
  </div>`;
}
function trocoHTML(rec, total) {
  if (rec == null || Number.isNaN(rec)) return `<small>Troco</small>—`;
  if (rec < total) return `<small>Falta</small><span style="color:var(--bad)">${R$(total - rec)}</span>`;
  return `<small>Troco</small>${R$(rec - total)}`;
}
function statusHTML(v) {
  if (v.status === 'cancelada') return `<span class="badge cancelada">desfeita</span>`;
  if (v.status === 'pendente') return `<span class="badge pendente">pendente · ${esc(v.nome)}</span>`;
  const f = FORMAS[v.forma];
  return `<span class="badge">${f.nome}</span>${v.eraPendente ? ` · ${esc(v.nome)} pagou às ${hora(v.pagoEm)}` : ''}`;
}

function renderHistorico() {
  const h = S.historico;
  return `<div class="hist">
    <div class="titulo-secao"><h2 style="font-size:22px;text-transform:none;letter-spacing:0;color:var(--ink)">Cantinas fechadas</h2></div>
    ${h.length ? h.map(c => { const r = resumo(c); return `<div class="card hist-item">
        <div class="info"><b>${esc(c.ministerio)}</b><small>${dataBR(c.data)}${c.prato ? ' · ' + esc(c.prato) : ''} · ${r.unid} itens vendidos${r.pendente ? ` · <span style="color:var(--warn);font-weight:700">${R$(r.pendente)} a receber</span>` : ''}</small></div>
        <span class="total num">${R$(r.recebido)}</span>
        <button class="btn prim" data-acao="ver-relatorio" data-id="${c.id}">Ver relatório</button>
        <button class="x" data-acao="excluir-hist" data-id="${c.id}" title="Apagar do histórico">🗑</button></div>`; }).join('')
      : `<div class="card vazio">Nenhuma cantina fechada ainda. Quando você fechar o caixa, o relatório aparece aqui.</div>`}
    <div class="card">
      <div class="titulo-secao"><h2>Backup</h2></div>
      <p style="margin:0 0 12px;color:var(--muted);font-size:14px">Os dados ficam salvos só neste navegador. Baixe um backup de vez em quando (ou mande o arquivo pro grupo do ministério). Restaurar junta o backup com o que já está aqui, sem apagar nada.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" data-acao="backup">Baixar backup</button>
        <button class="btn" data-acao="restaurar">Restaurar backup</button>
        ${!S.atual ? `<button class="btn ok" data-acao="ir" data-tela="inicio" style="margin-left:auto">+ Abrir nova cantina</button>` : ''}
      </div>
    </div>
  </div>`;
}

function renderRelatorio() {
  const c = S.historico.find(x => x.id === relatorioId);
  if (!c) { tela = 'historico'; return renderHistorico(); }
  const r = resumo(c);
  const pend = c.vendas.filter(v => v.status === 'pendente');
  const esperado = c.trocoInicial + r.porForma.dinheiro;
  const dif = c.dinheiroContado != null ? c.dinheiroContado - esperado : null;
  const itens = Object.values(r.porItem).filter(i => i.vendidos || i.estoque);

  return `<div class="rel-acoes no-print">
      <button class="btn" data-acao="ir" data-tela="historico">← Histórico</button>
      <button class="btn prim" data-acao="imprimir">Imprimir / Salvar PDF</button>
      ${!S.atual ? `<button class="btn" data-acao="ir" data-tela="inicio" style="margin-left:auto">+ Nova cantina</button>` : ''}
    </div>
    <article class="relatorio">
      <header class="rel-cab">
        <small>Fechamento de caixa</small>
        <h1>${esc(c.ministerio)}</h1>
        <p>${dataBR(c.data)}${c.prato ? ' · ' + esc(c.prato) : ''}</p>
      </header>

      <div class="rel-total"><span>Total arrecadado</span><strong class="num">${R$(r.recebido)}</strong></div>
      ${r.pendente ? `<div class="rel-linha"><span>A receber (pendências)</span><b class="num">${R$(r.pendente)}</b></div>` : ''}
      <div class="rel-linha"><span>Itens vendidos</span><b class="num">${r.unid}</b></div>

      <h2>Forma de pagamento</h2>
      <table><tbody>
        ${ORDEM.map(f => `<tr><td>${FORMAS[f].nome}</td><td class="r num">${R$(r.porForma[f])}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td class="r num">${R$(r.recebido)}</td></tr>
      </tbody></table>

      <h2>Itens</h2>
      <table><thead><tr><th>Item</th><th class="r">Vendidos</th><th class="r">Sobraram</th><th class="r">Valor</th></tr></thead><tbody>
        ${itens.map(i => `<tr><td>${esc(i.nome)}</td><td class="r num">${i.vendidos}</td>
          <td class="r num">${i.estoque == null ? '—' : i.estoque - i.vendidos}</td><td class="r num">${R$(i.receita)}</td></tr>`).join('')}
      </tbody></table>

      ${pend.length ? `<h2>Ficaram devendo</h2>
        <table><tbody>
        ${pend.map(v => `<tr><td>${esc(v.nome)}</td><td class="r num">${R$(v.total)}</td>
          <td class="r no-print" style="width:1%"><button class="btn sm" data-acao="receber" data-id="${v.id}">Receber</button></td></tr>`).join('')}
        </tbody></table>` : ''}

      ${dif != null ? `<h2>Dinheiro na gaveta</h2>
        <div class="rel-linha"><span>Contado: ${R$(c.dinheiroContado)} · esperado: ${R$(esperado)}</span>
          <b>${dif === 0 ? 'bateu ✔' : `${dif > 0 ? 'sobrou' : 'faltou'} ${R$(Math.abs(dif))}`}</b></div>` : ''}

      ${c.obs ? `<h2>Observações</h2><p class="obs">${esc(c.obs)}</p>` : ''}

      <details class="no-print rel-detalhes"><summary>Ver todas as vendas (${c.vendas.length})</summary>
        <table><tbody>
        ${c.vendas.map(v => `<tr class="${v.status === 'cancelada' ? 'cancelada' : ''}"><td class="num">${hora(v.hora)}</td><td>${esc(descreve(v))}</td>
          <td>${v.status === 'cancelada' ? 'desfeita' : v.status === 'pendente' ? `devendo · ${esc(v.nome)}` : FORMAS[v.forma].nome}</td>
          <td class="r num">${R$(v.total)}</td></tr>`).join('')}
        </tbody></table></details>
    </article>`;
}

function render() {
  if (tela === 'caixa' && !S.atual) tela = 'inicio';
  renderTopo();
  const html = tela === 'caixa' ? renderCaixa() : tela === 'historico' ? renderHistorico() : tela === 'relatorio' ? renderRelatorio() : renderInicio();
  $('#app').innerHTML = (tela === 'inicio' || tela === 'historico' ? instalarHTML() : '') + html;
  $('#app').classList.toggle('com-barra', tela === 'caixa' && S.carrinho.linhas.length > 0 && abaCel === 'vender');
  document.title = tela === 'relatorio' ? `Relatório – ${S.historico.find(x => x.id === relatorioId)?.ministerio || 'Cantina'}` : 'Caixa da Cantina';
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-acao]');
  if (!b || b.disabled) return;
  const fn = A[b.dataset.acao];
  if (fn) { e.preventDefault(); fn(b.dataset, b); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.campo && rascunho) rascunho[t.dataset.campo] = t.value;
  else if (t.dataset.itemCampo && rascunho) rascunho.itens[+t.dataset.itemIdx][t.dataset.itemCampo] = t.value;
  else if (t.id === 'recebido') {
    S.carrinho.recebido = t.value; salvar();
    $('#troco').innerHTML = trocoHTML(lerDinheiro(t.value), totalCarrinho());
  }
});
document.addEventListener('keydown', e => {
  if ($('#modal').open) return;
  const emCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  // Enter no último item da configuração cria nova linha
  if (e.key === 'Enter' && e.target.dataset.itemCampo && tela === 'inicio') {
    e.preventDefault();
    if (+e.target.dataset.itemIdx === rascunho.itens.length - 1) A['add-linha-setup']();
    return;
  }
  if (e.key === 'Enter' && e.target.id === 'recebido') { e.preventDefault(); A.pago(); return; }
  if (tela !== 'caixa' || emCampo || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key)) { const it = S.atual.itens[+e.key - 1]; if (it) adicionar(it.id, 1); }
});
window.addEventListener('beforeprint', () => { if (tela !== 'relatorio') toast('Para imprimir, abra o relatório de uma cantina fechada'); });

/* ---------- app instalável / offline ---------- */
const instalado = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ehIphone = /iphone|ipad|ipod/i.test(navigator.userAgent);
function instalarHTML() {
  if (instalado() || !location.protocol.startsWith('http')) return '';
  if (pedidoInstalar) return `<div class="instalar no-print"><span><b>Instale o app neste aparelho</b><br>Fica com ícone na tela e funciona sem internet.</span>
    <button class="btn prim" data-acao="instalar">Instalar</button></div>`;
  if (ehIphone) return `<div class="instalar no-print"><span><b>Para usar sem internet:</b> toque em <b>Compartilhar</b> (quadrado com seta ↑) e depois em <b>Adicionar à Tela de Início</b>.</span></div>`;
  return '';
}
A.instalar = async () => {
  if (!pedidoInstalar) return;
  pedidoInstalar.prompt();
  await pedidoInstalar.userChoice.catch(() => {});
  pedidoInstalar = null; render();
};
A.aba = d => { abaCel = d.aba; render(); window.scrollTo(0, 0); };
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; render(); });
window.addEventListener('appinstalled', () => { pedidoInstalar = null; render(); toast('App instalado! Procure o ícone na tela inicial.'); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

render();
</script>
</body>
</html>
